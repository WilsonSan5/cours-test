name: Symfony CI/CD

on:
    push:
        branches: ["main", "develop"]
    pull_request:
        branches: ["main", "develop"]

jobs:
    # ─────────────────────────────────────────────────────────────────
    # JOB 1 : Tests unitaires & fonctionnels (WebTestCase, PHPUnit)
    # ─────────────────────────────────────────────────────────────────
    unit-and-functional-tests:
        name: Unit & Functional Tests
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: app_test
                    POSTGRES_USER: app
                    POSTGRES_PASSWORD: "!ChangeMe!"
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            APP_ENV: test
            DATABASE_URL: "postgresql://app:!ChangeMe!@127.0.0.1:5432/app_test?serverVersion=16&charset=utf8"

        steps:
            # 1. Récupérer le code
            - name: Checkout code
              uses: actions/checkout@v4

            # 2. Configurer PHP 8.4
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql
                  coverage: none

            # 3. Valider composer.json
            - name: Validate composer.json
              run: composer validate

            # 4. Cache des dépendances Composer
            - name: Cache Composer packages
              id: composer-cache
              uses: actions/cache@v3
              with:
                  path: vendor
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-

            # 5. Installer les dépendances PHP
            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            # 6. Préparer l'environnement Symfony
            - name: Clear & warm-up Symfony cache
              run: |
                  php bin/console cache:clear
                  php bin/console cache:warmup

            # 7. Créer la base de données de test et appliquer les migrations
            - name: Prepare test database
              run: |
                  php bin/console doctrine:database:create --if-not-exists
                  php bin/console doctrine:migrations:migrate --no-interaction

            # 8. Lancer les tests unitaires et fonctionnels UNIQUEMENT (hors E2E)
            - name: Run unit & functional tests
              run: |
                  vendor/bin/phpunit \
                    --exclude-group e2e \
                    --testdox \
                    tests/ListItemTest.php \
                    tests/UserTest.php \
                    tests/Controller/

    # ─────────────────────────────────────────────────────────────────
    # JOB 2 : Tests end-to-end Panther (ChromeDriver + serveur Symfony)
    # ─────────────────────────────────────────────────────────────────
    e2e-tests:
        name: E2E Tests (Panther)
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: app_test
                    POSTGRES_USER: app
                    POSTGRES_PASSWORD: "!ChangeMe!"
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            APP_ENV: test
            DATABASE_URL: "postgresql://app:!ChangeMe!@127.0.0.1:5432/app_test?serverVersion=16&charset=utf8"
            # Panther : URL du serveur Symfony lancé localement
            PANTHER_APP_ENV: test
            PANTHER_NO_SANDBOX: 1       # Nécessaire dans les runners GitHub (pas de sandbox Chrome)
            PANTHER_CHROME_ARGUMENTS: "--disable-dev-shm-usage"

        steps:
            # 1. Récupérer le code
            - name: Checkout code
              uses: actions/checkout@v4

            # 2. Configurer PHP 8.4
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql
                  coverage: none

            # 3. Installer les dépendances PHP
            - name: Cache Composer packages
              id: composer-cache
              uses: actions/cache@v3
              with:
                  path: vendor
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            # 4. Installer Google Chrome (requis par Panther)
            - name: Install Google Chrome
              run: |
                  wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
                  sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
                  sudo apt-get update
                  sudo apt-get install -y google-chrome-stable

            # 5. Installer ChromeDriver via bdi (dbrekelmans/bdi)
            - name: Install ChromeDriver
              run: vendor/bin/bdi detect drivers

            # 6. Préparer Symfony
            - name: Clear & warm-up cache
              run: |
                  php bin/console cache:clear
                  php bin/console cache:warmup

            # 7. Préparer la base de données de test
            - name: Prepare test database
              run: |
                  php bin/console doctrine:database:create --if-not-exists
                  php bin/console doctrine:migrations:migrate --no-interaction

            # 8. Lancer le serveur Symfony en arrière-plan
            - name: Start Symfony dev server
              run: |
                  php -S 127.0.0.1:8000 -t public/ &
                  echo "Symfony server started"
                  sleep 2

            # 9. Lancer les tests E2E Panther
            - name: Run E2E tests (Panther)
              env:
                  PANTHER_EXTERNAL_BASE_URI: "http://127.0.0.1:8000"
              run: |
                  vendor/bin/phpunit \
                    --testdox \
                    tests/E2E/
