name: Symfony CI/CD

on:
    push:
        branches: ["main", "develop"]
    pull_request:
        branches: ["main", "develop"]

jobs:
    # ─────────────────────────────────────────────────────────────────
    # Tous les tests (unitaires + fonctionnels + E2E Panther) dans la
    # même image Docker que celle utilisée en local : Chromium, la base
    # PostgreSQL, les migrations et les assets sont préparés par le
    # service `test`. Environnement identique partout → plus de dérive.
    # ─────────────────────────────────────────────────────────────────
    tests:
        name: Tests (Docker)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run test suite in Docker
              run: docker compose run --build --rm test

            - name: Stop containers
              if: always()
              run: docker compose down -v
