
services:
  app:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8"
    ports:
      - "8000:8000"
    volumes:
      - .:/app:rw

  test:
    build:
      context: .
      target: dev
    profiles: ["test"]
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: test
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}_test?serverVersion=16&charset=utf8"
      PANTHER_NO_SANDBOX: 1
      PANTHER_CHROME_ARGUMENTS: "--disable-dev-shm-usage"
    volumes:
      - .:/app:rw
    command:
      - sh
      - -c
      - >-
        { [ -d vendor ] || composer install --no-interaction; } &&
        php bin/console doctrine:database:create --env=test --if-not-exists &&
        php bin/console doctrine:migrations:migrate --env=test --no-interaction --allow-no-migration &&
        vendor/bin/phpunit --testdox

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###


